[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ficc-policy-opa"
version = "0.2.5"
description = "Trusted isolated OPA policy provider for FICC"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.entry-points."ficc.policy"]
opa = "ficc_policy_opa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ficc_policy_opa = ["capabilities.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
