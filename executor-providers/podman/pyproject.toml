[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ficc-executor-podman"
version = "0.2.5"
description = "Rootless Podman execution provider for the FICC local supervisor"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.entry-points."ficc.executor"]
podman = "ficc_executor_podman"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ficc_executor_podman = ["barrier", "barrier.c"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
