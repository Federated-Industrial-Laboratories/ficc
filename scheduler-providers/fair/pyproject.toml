[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ficc-scheduler-fair"
version = "0.2.5"
description = "Project-fair scheduling for FICC contributor workloads"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.entry-points."ficc.scheduler"]
fair = "ficc_scheduler_fair"

[tool.setuptools.packages.find]
where = ["src"]
