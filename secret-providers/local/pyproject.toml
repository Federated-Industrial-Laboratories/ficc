[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ficc-secret-local"
version = "0.2.5"
description = "Authenticated encrypted local secrets for FICC"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography==50.0.2"]

[project.entry-points."ficc.secret"]
local = "ficc_secret_local"

[tool.setuptools.packages.find]
where = ["src"]
