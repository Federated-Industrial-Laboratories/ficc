name: Checks
on:
  push:
    branches: [master, overview, jobs, workspace, qualification, console, packages, installation, castle-bravo]
  pull_request:
    branches: [master, overview]
permissions:
  contents: read
jobs:
  source-and-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap build-essential libssl-dev openssh-server tmux zstd squashfs-tools dbus-user-session apparmor
      - run: npm ci --prefix web && npm run build --prefix web
      - run: python tools/build-modules.py defaults --fetch --output src/ficc/module_packages
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install declared runtime providers after the host
        run: python tools/runtime_packages.py --output "$RUNNER_TEMP/ficc-runtime-wheels" --install
      - name: Prepare the data-worker sandbox
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          probe_sandbox() {
            python -c 'import asyncio; from ficc.modules.sandbox import Sandbox; status = asyncio.run(Sandbox().probe()); print(status.reason); raise SystemExit(0 if status.available else 1)'
          }
          if ! probe_sandbox; then
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
            sudo bash tools/module-sandbox-policy/install.sh install
            probe_sandbox
          fi
      - name: Check policy and identity provider contracts
        run: |
          python -m pytest policy-providers/opa/tests
          python -m pytest identity-providers/oidc/tests
      - run: bash tools/check.sh
      - run: FICC_REQUIRE_SSH=1 python -m pytest tests/integration
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - run: python -m pip_audit -r state-providers/postgresql/requirements.lock --disable-pip --no-deps
      - run: python -m pip_audit -r identity-providers/oidc/requirements.lock --disable-pip --no-deps
      - run: python -m build --no-isolation
      - name: Install a fresh source checkout
        run: |
          env HOME="$RUNNER_TEMP/ficc-home" XDG_DATA_HOME="$RUNNER_TEMP/ficc-home/.local/share" \
            XDG_CONFIG_HOME="$RUNNER_TEMP/ficc-home/.config" XDG_CACHE_HOME="$RUNNER_TEMP/ficc-home/.cache" \
            ./install.sh --no-desktop
          "$RUNNER_TEMP/ficc-home/.local/bin/ficc" --version
      - name: Browser checks
        env:
          FICC_STATE_DIR: /tmp/ficc-ci-state
          FICC_URL: http://127.0.0.1:8171
          FICC_BROWSER: /usr/bin/google-chrome
        run: |
          ficc serve --demo --state-dir "$FICC_STATE_DIR" --port 8171 > /tmp/ficc-ci.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid"; wait "$service_pid" || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent "$FICC_URL/api/v1/health" > /dev/null; then break; fi
            sleep 0.2
          done
          npm test --prefix web
